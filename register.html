<style>

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;

    background: url("./images/leadsbg.png") no-repeat center center/cover;

    display: flex;
    justify-content: flex-end;   /* Right side */
    align-items: center;

    padding: 0 80px;

    font-family: 'Segoe UI', sans-serif;
}

.container{

    background:rgba(255,255,255,.96);

    padding:40px;

    border-radius:20px;

    width:100%;
    max-width:420px;

    box-shadow:
    0 20px 45px rgba(0,0,0,.18);

    backdrop-filter:blur(8px);
}

h2{

    text-align:center;

    color:#111827;

    margin-bottom:8px;

    font-size:30px;

    font-weight:700;
}

input{

    width:100%;

    height:48px;

    padding:0 15px;

    margin:10px 0;

    border-radius:10px;

    border:1px solid #d9d9d9;

    font-size:15px;

    transition:.3s;
}

input:focus {

  outline: none;

  border-color: #6366f1;

  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}

button{

    width:100%;

    height:48px;

    margin-top:18px;

    border:none;

    border-radius:10px;

    background:linear-gradient(135deg,#6366f1,#4f46e5);

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    transform:translateY(-2px);

    box-shadow:0 12px 24px rgba(99,102,241,.35);
}

button:hover {

  transform: translateY(-2px);

  box-shadow: 0 10px 20px rgba(79,70,229,0.25);
}

.link{

    text-align:center;

    margin-top:22px;

    color:#64748b;

    font-size:14px;
}

.link a{

    color:#6366f1;

    font-weight:600;

    text-decoration:none;
}

.link a:hover{

    text-decoration:underline;
}

#error {

  color: red;

  font-size: 13px;

  margin-top: 10px;

  text-align: center;
}


.logo-box{

    width:70px;
    height:70px;

    margin:0 auto 18px;

            background:
    linear-gradient(
      135deg,
      #6366f1,
      #4f46e5
    );

    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:0 10px 25px rgba(99,102,241,.18);
}

.logo-box img{

    width:50px;
    height:50px;
}

.subtitle{

    text-align:center;

    color:#64748b;

    margin-bottom:25px;

    line-height:1.5;

    font-size:14px;
}


.left-panel{
    position: relative;

    background: linear-gradient(
        rgba(15,23,42,0.75),
        rgba(99,102,241,0.65)
    ),
    url("./images/leadsbg.png");

    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;

    padding: 60px;

    color: #fff;

<div class="container">

    <h2>Create Your Account</h2>

  <script>
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.className = "toast show";

      setTimeout(() => {
        t.className = "toast";
      }, 3000);
    }

    //   } else {
    //     document.getElementById("error").innerText = res.message;
    //   }
    // }


    async function register() {
      const nameInput = document.getElementById("name");
      const businessInput = document.getElementById("business");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const whatsappInput = document.getElementById("whatsapp");
      const error = document.getElementById("error");

      const name = nameInput.value.trim();
      const business_name = businessInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const whatsapp_number = whatsappInput.value.trim();

      // Reset error
      error.innerText = "";

      // ✅ Validation
      if (!name) {
        error.innerText = "Name is required";
        nameInput.focus();
        return;
      }

      if (!business_name) {
        error.innerText = "Business name is required";
        businessInput.focus();
        return;
      }

      if (!email) {
        error.innerText = "Email is required";
        emailInput.focus();
        return;
      }

      if (!emailInput.checkValidity()) {
        error.innerText = "Enter a valid email";
        emailInput.focus();
        return;
      }

      if (!password) {
        error.innerText = "Password is required";
        passwordInput.focus();
        return;
      }

      if (password.length < 6) {
        error.innerText = "Password must be at least 6 characters";
        passwordInput.focus();
        return;
      }

      if (!whatsapp_number) {
        error.innerText = "WhatsApp number is required";
        whatsappInput.focus();
        return;
      }

      // simple phone check (10 digits)
      if (!/^\d{10}$/.test(whatsapp_number)) {
        error.innerText = "Enter a valid 10-digit WhatsApp number";
        whatsappInput.focus();
        return;
      }

      try {
        // ✅ API call
        const res = await apiCall('/auth/register', 'POST', {
          name,
          business_name,
          email,
          password,
          whatsapp_number
        });

        if (res.success) {
          showToast("Registered Successfully");

          setTimeout(() => {
            window.location.href = "index.html";
          }, 2000);

        } else {
          error.innerText = res.message || "Registration failed";
        }

      } catch (err) {
        error.innerText = "Something went wrong. Try again.";
        console.error(err);
      }
    }

  </script>
  <div id="toast" class="toast"></div>
