<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ADD THIS -->
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon.png">
<link rel="shortcut icon" href="./assets/favicon.png">
</head>
<head>
  <title>Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<button class="menu-btn" onclick="toggleSidebar()">☰</button>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <!-- Sidebar -->
  <div class="sidebar">
    <h3>LeadsZen</h3>
    <a href="dashboard.html">Dashboard</a>
    <a href="leads.html">Leads</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="deals.html">Deals</a>
  </div>
  <!-- Main -->
  <div class="main">
    <!-- Topbar -->
    <!-- <div class="topbar"> -->
    <div class="topbar">
      <div>
        <h2 id="welcome">Welcome</h2>
        <p class="sub">Here’s your business overview</p>
      </div>
      <div class="profile" onclick="toggleMenu(event)">
        <span id="username">User</span>
        <div class="avatar" id="avatar">U</div>
        <!-- Dropdown -->
        <div class="dropdown" id="dropdown">
          <div class="user-info">
            <strong id="drop-name">User</strong><br>
            <small id="drop-email">email</small>
          </div>
          <hr>
          <div class="menu-item" onclick="goProfile()">Edit Profile</div>
          <div class="menu-item logout" onclick="logout()">Logout</div>
        </div>
      </div>
    </div>
    <div class="topbar">
      <h2>Profile Settings</h2>
    </div>
    <!-- Profile Card -->
    <div class="profile-wrapper">
      <div class="card profile-card">
        <label>Name</label>
        <input id="name">
        <label>Email</label>
        <input id="email" disabled>
        <label>Business Name</label>
        <input id="business">
        <label>WhatsApp</label>
        <input id="whatsapp">
        <label>Location</label>
        <input id="location">
        <button onclick="updateProfile()">💾 Save Changes</button>
        <p id="msg"></p>
      </div>
    </div>
  </div>
  <!-- <script src="js/api.js"></script> -->
  <script>
    async function loadProfile() {
      const res = await apiCall('/client/me');
      if (res.success) {
        const d = res.data;
        document.getElementById("name").value = d.name || "";
        document.getElementById("email").value = d.email || "";
        document.getElementById("business").value = d.business_name || "";
        document.getElementById("whatsapp").value = d.whatsapp_number || "";
        document.getElementById("location").value = d.location || "";
      }
    }
    async function loadUser() {
      const res = await apiCall('/client/me'); // already gives data
      if (!res || !res.success) return;
      const d = res.data;
      // ✅ Set all UI data
      document.getElementById("welcome").innerText = `Welcome, ${d.name}`;
      document.getElementById("username").innerText = d.name;
      document.getElementById("drop-name").innerText = d.name;
      document.getElementById("drop-email").innerText = d.email;
      // ✅ Avatar (IMPORTANT FIX)
      const avatar = document.getElementById("avatar");
      if (avatar) {
        avatar.innerText = d.name ? d.name[0].toUpperCase() : "U";
      }
    }
    function toggleMenu(event) {
      event.stopPropagation(); // 🔥 prevents immediate close
      const menu = document.getElementById("dropdown");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
      menu.classList.toggle("show");
    }
// close dropdown when clicking outside
document.addEventListener("click", function (event) {
  const profile = document.querySelector(".profile");
  const dropdown = document.getElementById("dropdown");
  if (!profile.contains(event.target)) {
    dropdown.style.display = "none";
  }
});
    function goProfile() {
      window.location.href = "profile.html";
    }
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "index.html";
    }
  </script>
  <script src="js/api.js"></script>
  <script>
    async function updateProfile() {
      const data = {
        name: document.getElementById("name").value,
        business_name: document.getElementById("business").value,
        whatsapp_number: document.getElementById("whatsapp").value,
        location: document.getElementById("location").value
      };
      const res = await apiCall('/client/update', 'PUT', data);
      const msg = document.getElementById("msg");
      if (res.success) {
        msg.style.color = "green";
        msg.innerText = "Profile updated successfully ✅";
      } else {
        msg.style.color = "red";
        msg.innerText = res.message;
      }
    }
    loadProfile();
    loadUser()
    toggleMenu()
    goProfile()
    logout()
  </script>
  <script>
function toggleSidebar() {
  document.querySelector(".sidebar")
    .classList.toggle("active");
  document.getElementById("overlay")
    .classList.toggle("show");
}
function closeSidebar() {
  document.querySelector(".sidebar")
    .classList.remove("active");
  document.getElementById("overlay")
    .classList.remove("show");
}
</script>
</body>
</html>
