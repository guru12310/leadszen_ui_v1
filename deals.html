<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Deal | LeadsZen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/deal.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<style>
    /* =====================================
   LeadsZen CRM - Create Deal
===================================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}
body{
    background:#f5f7fb;
    color:#333;
}
/* =====================================
   Main
===================================== */
.main{
    margin-left:250px;
    padding:30px;
}
/* =====================================
   Topbar
===================================== */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}
.topbar h2{
    font-size:30px;
    color:#1e293b;
    margin-bottom:6px;
}
.topbar p{
    color:#64748b;
    font-size:15px;
}
/* =====================================
   Profile
===================================== */
.profile{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}
.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#6366f1;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}
/* =====================================
   Cards
===================================== */
.deal-card{
    background:#fff;
    border-radius:16px;
    padding:28px;
    margin-bottom:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}
.deal-card h3{
    margin-bottom:22px;
    color:#111827;
    font-size:20px;
    border-left:5px solid #6366f1;
    padding-left:12px;
}
/* =====================================
   Grid
===================================== */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}
.form-group{
    display:flex;
    flex-direction:column;
}
.form-group label{
    margin-bottom:8px;
    color:#475569;
    font-weight:600;
    font-size:14px;
}
/* =====================================
   Inputs
===================================== */
input,
select,
textarea{
    width:100%;
    padding:13px 15px;
    border:1px solid #d9dce5;
    border-radius:10px;
    background:#fff;
    font-size:15px;
    transition:.3s;
}
textarea{
    resize:vertical;
    min-height:140px;
}
input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
}
/* =====================================
   Buttons
===================================== */
.btn-group{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:30px;
}
.btn{
    min-width:150px;
    height:48px;
    border:none;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
    font-weight:600;
}
.primary{
    background:#6366f1;
    color:#fff;
}
.primary:hover{
    background:#4f46e5;
    transform:translateY(-2px);
}
.secondary{
    background:#ef4444;
    color:#fff;
}
.secondary:hover{
    background:#dc2626;
}
.outline{
    background:#fff;
    color:#6366f1;
    border:2px solid #6366f1;
}
.outline:hover{
    background:#6366f1;
    color:#fff;
}
/* =====================================
   Sidebar Active
===================================== */
.sidebar a.active{
    background:#6366f1;
    color:#fff;
    border-radius:8px;
}
/* =====================================
   Mobile
===================================== */
@media(max-width:1024px){
.main{
    margin-left:0;
    padding:20px;
}
.form-grid{
    grid-template-columns:1fr;
}
}
@media(max-width:768px){
.topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
}
.topbar h2{
    font-size:24px;
}
.deal-card{
    padding:20px;
}
.btn-group{
    flex-direction:column;
}
.btn{
    width:100%;
}
}
@media(max-width:480px){
.main{
    padding:15px;
}
.deal-card{
    padding:18px;
}
.deal-card h3{
    font-size:18px;
}
input,
select,
textarea{
    font-size:14px;
}
.btn{
    height:46px;
    font-size:14px;
}
}
</style>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <!-- <img src="./assets/favicon.png" alt=""> -->
            <span>LeadsZen</span>
        </div>
        <a href="dashboard.html">Dashboard</a>
        <a href="leads.html">Leads</a>
        <a href="deals.html" class="active">Deals</a>
        <a href="profile.html">Profile</a>
    </div>
    <!-- Main -->
    <div class="main">
        <!-- Top Bar -->
        <div class="topbar">
            <div>
                <h2>Create Deal</h2>
                <p>Create a new sales opportunity</p>
            </div>
            <div class="profile">
                <span id="username">User</span>
                <div class="avatar" id="avatar">
                    U
                </div>
            </div>
        </div>
        <!-- Form Card -->
        <div class="deal-card">
            <h3>Customer Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Customer Name *</label>
                    <input
                        type="text"
                        id="customer_name"
                        placeholder="Enter customer name"
                        required>
                </div>
                <div class="form-group">
                    <label>Business Name</label>
                    <input
                        type="text"
                        id="business_name"
                        placeholder="Business name">
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Phone number">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Email address">
                </div>
            </div>
        </div>
        <!-- Deal Information -->
        <div class="deal-card">
            <h3>Deal Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Deal Name *</label>
                    <input
                        id="deal_name"
                        placeholder="Deal title">
                </div>
                <div class="form-group">
                    <label>Deal Value *</label>
                    <input
                        id="deal_value"
                        type="number"
                        placeholder="0">
                </div>
                <div class="form-group">
                    <label>Currency</label>
                    <select id="currency">
                        <option value="INR">₹ INR</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Lead Source</label>
                    <select id="lead_source">
                        <option>Facebook Ads</option>
                        <option>Instagram Ads</option>
                        <option>Website</option>
                        <option>WhatsApp</option>
                        <option>Referral</option>
                        <option>Manual</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Stage</label>
                    <select id="stage">
                        <option>New</option>
                        <option>Contacted</option>
                        <option>Qualified</option>
                        <option>Proposal Sent</option>
                        <option>Negotiation</option>
                        <option>Won</option>
                        <option>Lost</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select id="priority">
                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Expected Closing Date</label>
                    <input
                        type="date"
                        id="expected_close">
                </div>
                <div class="form-group">
                    <label>Next Follow-up</label>
                    <input
                        type="date"
                        id="followup">
                </div>
            </div>
        </div>
        <!-- Notes -->
        <div class="deal-card">
            <h3>Description</h3>
            <textarea
                id="description"
                rows="6"
                placeholder="Write deal description..."></textarea>
        </div>
        <!-- Buttons -->
        <div class="btn-group">
            <button
                class="btn secondary"
                onclick="history.back()">
                Cancel
            </button>
            <button
                class="btn outline"
                onclick="saveDraft()">
                Save Draft
            </button>
            <button
                class="btn primary"
                onclick="createDeal()">
                Save Deal
            </button>
        </div>
    </div>
    <!-- <script src="js/deal.js"></script> -->
    <script>
        const API = "https://leadszen-v1.onrender.com/api";
document.addEventListener("DOMContentLoaded", () => {
    const token = localStorage.getItem("token");
    if (!token) {
        showToast("Please login to continue.");
        setTimeout(() => {
            window.location.href = "login.html";
        }, 2000);
        return;
    }
});
function showToast(message) {
    let toast = document.getElementById("toast");
    if (!toast) {
        toast = document.createElement("div");
        toast.id = "toast";
        toast.style.position = "fixed";
        toast.style.bottom = "30px";
        toast.style.right = "30px";
        toast.style.background = "#6366f1";
        toast.style.color = "#fff";
        toast.style.padding = "15px 20px";
        toast.style.borderRadius = "8px";
        toast.style.zIndex = "9999";
        toast.style.boxShadow = "0 10px 25px rgba(0,0,0,.25)";
        document.body.appendChild(toast);
    }
    toast.innerText = message;
    toast.style.display = "block";
    setTimeout(() => {
        toast.style.display = "none";
    },3000);
}
function validate(){
    const customerName=document.getElementById("customer_name").value.trim();
    const phone=document.getElementById("phone").value.trim();
    const dealName=document.getElementById("deal_name").value.trim();
    const dealValue=document.getElementById("deal_value").value.trim();
    if(customerName==""){
        showToast("Customer name is required.");
        return false;
    }
    if(phone==""){
        showToast("Phone number is required.");
        return false;
    }
    if(!/^[6-9]\d{9}$/.test(phone)){
        showToast("Enter a valid phone number.");
        return false;
    }
    if(dealName==""){
        showToast("Deal name is required.");
        return false;
    }
    if(dealValue==""){
        showToast("Deal value is required.");
        return false;
    }
    if(Number(dealValue)<=0){
        showToast("Deal value should be greater than zero.");
        return false;
    }
    return true;
}
async function createDeal(){
    if(!validate()) return;
    const btn=document.querySelector(".primary");
    btn.disabled=true;
    btn.innerText="Saving...";
    const payload={
        customer_name:document.getElementById("customer_name").value.trim(),
        business_name:document.getElementById("business_name").value.trim(),
        phone:document.getElementById("phone").value.trim(),
        email:document.getElementById("email").value.trim(),
        deal_name:document.getElementById("deal_name").value.trim(),
        deal_value:Number(document.getElementById("deal_value").value),
        currency:document.getElementById("currency").value,
        lead_source:document.getElementById("lead_source").value,
        stage:document.getElementById("stage").value,
        priority:document.getElementById("priority").value,
        expected_close:document.getElementById("expected_close").value,
        followup:document.getElementById("followup").value,
        description:document.getElementById("description").value.trim()
    };
    try{
        const response=await fetch(`${API}/deals`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+localStorage.getItem("token")
            },
            body:JSON.stringify(payload)
        });
        const result=await response.json();
        if(result.success){
            showToast("Deal created successfully.");
            clearForm();
        }else{
            showToast(result.message);
        }
    }catch(error){
        console.log(error);
        showToast("Unable to create deal.");
    }
    btn.disabled=false;
    btn.innerText="Save Deal";
}
function saveDraft(){
    showToast("Draft feature coming soon.");
}
function clearForm(){
    document.getElementById("customer_name").value="";
    document.getElementById("business_name").value="";
    document.getElementById("phone").value="";
    document.getElementById("email").value="";
    document.getElementById("deal_name").value="";
    document.getElementById("deal_value").value="";
    document.getElementById("currency").selectedIndex=0;
    document.getElementById("lead_source").selectedIndex=0;
    document.getElementById("stage").selectedIndex=0;
    document.getElementById("priority").selectedIndex=1;
    document.getElementById("expected_close").value="";
    document.getElementById("followup").value="";
    document.getElementById("description").value="";
}
    </script>
</body>
</html>
